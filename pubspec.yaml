name: moe_flutter_notify
description: Notification package for MOE Flutter ecosystem — push notification, in-app notification, multi-channel
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.7.0
  flutter_local_notifications: ^17.2.4
  moe_flutter_core:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Core.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
